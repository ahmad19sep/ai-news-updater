<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI x Ahmad Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="lockbox">
    <div class="wordmark"><span class="mark">A</span><span>AI x Ahmad <b>Studio</b></span></div>
    <p>Private desk. Enter your access code.</p>
    <div class="err" id="lockerr" aria-live="polite"></div>
    <input id="lockcode" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code">
    <button class="btn primary wide" id="lockbtn">Enter</button>
  </div>
</div>

<div class="app">
  <aside class="rail">
    <a class="brand" href="#today"><span class="mark">A</span><span class="bt">AI x Ahmad<small>Studio</small></span></a>
    <nav aria-label="Main">
      <div class="navgrp">Pipeline</div>
      <a class="navitem" href="#today" data-screen="today" data-icon="home"><span>Today</span></a>
      <a class="navitem" href="#discover" data-screen="discover" data-icon="radar"><span>Discover</span></a>
      <a class="navitem" href="#ideas" data-screen="ideas" data-icon="bulb"><span>Ideas</span><span class="navcount" id="nc-ideas"></span></a>
      <a class="navitem" href="#compose" data-screen="compose" data-icon="pen"><span>Compose</span><span class="navcount" id="nc-compose"></span></a>
      <a class="navitem" href="#schedule" data-screen="schedule" data-icon="calendar"><span>Schedule</span><span class="navcount" id="nc-schedule"></span></a>
      <a class="navitem" href="#published" data-screen="published" data-icon="check"><span>Published</span></a>
      <div class="navgrp">Workspace</div>
      <a class="navitem" href="#library" data-screen="library" data-icon="book"><span>Library</span></a>
      <a class="navitem" href="#settings" data-screen="settings" data-icon="settings"><span>Settings</span></a>
    </nav>
    <div class="railfoot">
      <span class="avatar">A</span>
      <span class="who"><b>@aixahmad</b><small id="chanlabel">LinkedIn desk</small></span>
      <button class="iconbtn" id="cloudbtn" title="Sync status" aria-label="Sync status"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="ttitle"><h1 id="pageTitle">Today</h1><div class="ps" id="pageSub"></div></div>
      <div class="tutil">
        <span class="updated" id="updated"></span>
        <button class="iconbtn" id="themebtn" title="Switch theme" aria-label="Switch theme"></button>
      </div>
    </header>
    <div class="wrap">
      <section id="s-today" class="screen"></section>
      <section id="s-discover" class="screen" hidden>
        <div class="subtabs" id="disc-tabs" role="tablist">
          <button class="subtab active" data-sub="news" role="tab">News</button>
          <button class="subtab" data-sub="agents" role="tab">Agents &amp; AI</button>
          <button class="subtab" data-sub="pulse" role="tab">Pulse</button>
        </div>
        <div id="disc-body"></div>
      </section>
      <section id="s-ideas" class="screen" hidden></section>
      <section id="s-compose" class="screen" hidden>
        <div class="compose">
          <div class="clist" id="compose-list"></div>
          <div class="ceditor" id="compose-editor"></div>
        </div>
      </section>
      <section id="s-schedule" class="screen" hidden></section>
      <section id="s-published" class="screen" hidden></section>
      <section id="s-library" class="screen" hidden></section>
      <section id="s-settings" class="screen" hidden></section>
    </div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
window.STUDIO_DATA = __DATA__;
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
