<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI x Ahmad Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="lock" hidden>
  <div class="lockbox">
    <div class="wordmark"><span class="mark">A</span>AI x Ahmad Studio</div>
    <p>Private desk. Enter your access code.</p>
    <div class="err" id="lockerr" aria-live="polite"></div>
    <input id="lockcode" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code">
    <button class="btn primary wide" id="lockbtn">Continue</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="ws" href="#today"><span class="mark">A</span><span class="wsname">AI x Ahmad</span><span class="wssub">Studio</span></a>
    <button class="search" id="palettebtn" type="button"><span class="si"></span><span>Search or jump to…</span><kbd>⌘K</kbd></button>
    <nav aria-label="Main">
      <div class="navgrp">Pipeline</div>
      <a class="navitem" href="#today" data-screen="today" data-icon="home"><span>Today</span><kbd>1</kbd></a>
      <a class="navitem" href="#discover" data-screen="discover" data-icon="radar"><span>Discover</span><kbd>2</kbd></a>
      <a class="navitem" href="#ideas" data-screen="ideas" data-icon="bulb"><span>Ideas</span><span class="navcount" id="nc-ideas"></span></a>
      <a class="navitem" href="#compose" data-screen="compose" data-icon="pen"><span>Compose</span><span class="navcount" id="nc-compose"></span></a>
      <a class="navitem" href="#schedule" data-screen="schedule" data-icon="calendar"><span>Schedule</span><span class="navcount" id="nc-schedule"></span></a>
      <a class="navitem" href="#published" data-screen="published" data-icon="check"><span>Published</span><kbd>6</kbd></a>
      <div class="navgrp">Workspace</div>
      <a class="navitem" href="#library" data-screen="library" data-icon="book"><span>Library</span><kbd>7</kbd></a>
      <a class="navitem" href="#settings" data-screen="settings" data-icon="settings"><span>Settings</span><kbd>8</kbd></a>
    </nav>
    <div class="sidefoot">
      <span class="avatar">A</span>
      <span class="who"><b>Ahmad</b><small>@aixahmad</small></span>
      <button class="btn icon ghost" id="cloudbtn" title="Sync status" aria-label="Sync status"></button>
      <button class="btn icon ghost" id="themebtn" title="Switch theme" aria-label="Switch theme"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn icon ghost" id="sidebtn" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar"></button>
      <div class="ttitle"><h1 id="pageTitle">Today</h1><span class="ps" id="pageSub"></span></div>
      <div class="tutil" id="topActions"></div>
    </header>
    <div class="wrap">
      <section id="s-today" class="screen"></section>
      <section id="s-discover" class="screen" hidden>
        <div class="subtabs" id="disc-tabs" role="tablist">
          <button class="subtab active" data-sub="news" role="tab">News</button>
          <button class="subtab" data-sub="agents" role="tab">Agents &amp; AI</button>
          <button class="subtab" data-sub="pulse" role="tab">Pulse</button>
        </div>
        <div id="disc-body"></div>
      </section>
      <section id="s-ideas" class="screen" hidden></section>
      <section id="s-compose" class="screen" hidden>
        <div class="compose">
          <div class="clist" id="compose-list"></div>
          <div class="ceditor" id="compose-editor"></div>
        </div>
      </section>
      <section id="s-schedule" class="screen" hidden></section>
      <section id="s-published" class="screen" hidden></section>
      <section id="s-library" class="screen" hidden></section>
      <section id="s-settings" class="screen" hidden></section>
    </div>
  </main>
</div>

<div id="palette" hidden>
  <div class="pal">
    <input id="pal-q" type="text" placeholder="Type a command or screen…" autocomplete="off" aria-label="Command palette">
    <div id="pal-list" role="listbox"></div>
    <div class="pal-foot"><span><kbd>↑↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span><span><kbd>?</kbd> all shortcuts</span></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
window.STUDIO_DATA = __DATA__;
</script>
<script>
/*__JS__*/
</script>
</body>
</html>
