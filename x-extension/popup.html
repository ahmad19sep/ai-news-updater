<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #faf9f5; color: #28261f; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 13px 14px; border-bottom: 1px solid #e6e1d4; }
  .orb { width: 24px; height: 24px; border-radius: 6px; background: #c4633f; display: flex;
         align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
  .hd b { font-size: 14px; }
  .body { padding: 14px; }
  .prev { font-size: 12.5px; color: #56606b; background: #fff; border: 1px solid #e6e1d4;
          border-radius: 8px; padding: 9px 11px; max-height: 96px; overflow: auto; white-space: pre-wrap;
          margin-bottom: 12px; min-height: 20px; }
  button { width: 100%; border: none; background: #c4633f; color: #fff; font-weight: 600; font-size: 14px;
           padding: 11px; border-radius: 9px; cursor: pointer; }
  button:hover { background: #af522f; }
  button:disabled { opacity: .6; cursor: default; }
  .st { font-size: 12.5px; color: #56606b; margin-top: 10px; text-align: center; min-height: 16px; }
  .st.ok { color: #1a7f37; font-weight: 600; }
  .st.err { color: #bf3d2c; }
</style>
</head>
<body>
  <div class="hd"><span class="orb">◐</span><b>Send to AI Radar Studio</b></div>
  <div class="body">
    <div class="prev" id="prev">Open a tweet, then click below.</div>
    <button id="send">📤 Send this post to Radar</button>
    <div class="st" id="st"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
