name: AI News Radar (every 30 min)

on:
  schedule:
    # Twice an hour so fresh news lands within ~30-60 min (GitHub cron can drift
    # under load, so two slots keep us comfortably inside the 1-2 hour target).
    - cron: "5,35 * * * *"
  workflow_dispatch:        # also allows manual "Run workflow" button

permissions:
  contents: write           # needed to save news.db back to the repo

concurrency:
  group: fetch              # never run two cycles at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Karachi                          # digest times in Pakistan time
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # your private topic, kept secret
      SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}  # studio access code (hash goes in page)
      FIREBASE_URL: ${{ secrets.FIREBASE_URL }}    # Realtime DB URL, baked in so devices auto-connect
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch news + send alerts + digest check
        run: python main.py

      - name: Rebuild the online dashboard
        run: python generate_site.py

      - name: Save database + dashboard back to the repo
        run: |
          git config user.name "ai-news-radar-bot"
          git config user.email "actions@github.com"
          git add news.db docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly news update"
            # If Ahmad pushed code while we ran, retry and auto-resolve
            # conflicts on generated files (our fresh data wins; the next
            # hourly run regenerates the page with his new code anyway).
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 3 ]; then echo "giving up after 3 retries"; exit 1; fi
              git pull --rebase -X theirs origin main || {
                git checkout --theirs -- news.db docs/ 2>/dev/null || true
                git add news.db docs/
                GIT_EDITOR=true git rebase --continue || git rebase --skip || true
              }
            done
          fi

      - name: Phone alert if the cloud fetch broke
        if: failure()
        run: |
          curl -s -m 15 \
            -H "Title: AI News Radar - cloud problem" \
            -H "Priority: high" -H "Tags: warning" \
            -d "The hourly cloud fetch failed. Check github.com/ahmad19sep/ai-news-updater/actions" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
