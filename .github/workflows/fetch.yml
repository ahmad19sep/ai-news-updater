name: AI News Radar (hourly)

on:
  schedule:
    # Once an hour: fresh news lands within ~1 hour (and well under the 1-2h
    # target even with GitHub cron drift). Parallel fetch makes each run fast,
    # so this is light on Actions minutes and commits. Bump to "11,41 * * * *"
    # for every 30 min if you ever want it fresher.
    - cron: "11 * * * *"
  workflow_dispatch:        # also allows manual "Run workflow" button

permissions:
  contents: write           # needed to save news.db back to the repo

concurrency:
  group: fetch              # never run two cycles at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Karachi                          # digest times in Pakistan time
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # your private topic, kept secret
      SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}  # studio access code (hash goes in page)
      FIREBASE_URL: ${{ secrets.FIREBASE_URL }}    # Realtime DB URL, baked in so devices auto-connect
      NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}    # NewsData.io API key (breaking-news firehose)
      CAIRA_API_URL: ${{ secrets.CAIRA_API_URL }}  # Caira base API url (auto-dispatch high-score tasks)
      CAIRA_API_KEY: ${{ secrets.CAIRA_API_KEY }}  # Caira API token (kept secret)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch news + send alerts + digest check
        run: python main.py

      - name: Rebuild the public news site + the studio
        run: |
          python generate_public.py
          python generate_site.py

      - name: Refresh weekly digest (dated archive only on Saturdays)
        run: |
          python - <<'PY'
          import datetime, digest
          # TZ env is Asia/Karachi, so "Saturday" means Saturday in Pakistan time
          is_saturday = datetime.datetime.now().weekday() == 5
          digest.generate_weekly_digest("news.db", "docs/digests", archive=is_saturday)
          PY

      - name: Save database + dashboard back to the repo
        run: |
          git config user.name "ai-news-radar-bot"
          git config user.email "actions@github.com"
          git add news.db docs/
          if ! git diff --cached --quiet; then
            git commit -m "data: hourly news update"
            # If Ahmad pushed code while we ran, retry and auto-resolve
            # conflicts on generated files (our fresh data wins; the next
            # hourly run regenerates the page with his new code anyway).
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 3 ]; then echo "giving up after 3 retries"; exit 1; fi
              git pull --rebase -X theirs origin main || {
                git checkout --theirs -- news.db docs/ 2>/dev/null || true
                git add news.db docs/
                GIT_EDITOR=true git rebase --continue || git rebase --skip || true
              }
            done
          fi

      - name: Phone alert if the cloud fetch broke
        if: failure()
        run: |
          curl -s -m 15 \
            -H "Title: AI News Radar - cloud problem" \
            -H "Priority: high" -H "Tags: warning" \
            -d "The hourly cloud fetch failed. Check github.com/ahmad19sep/ai-news-updater/actions" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
