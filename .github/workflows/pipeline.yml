name: Content pipeline (API drafts, on demand)

# Runs the Claude agents in the cloud on demand so drafts are waiting in the
# Studio. Nothing is posted: drafts only.
# Needs the ANTHROPIC_API_KEY secret. With FIREBASE_URL + SITE_PASSCODE set,
# state uses the existing legacy Firebase integration (auth/rules unverified).
# Local private state is never committed or uploaded by this cloud workflow;
# without the existing cloud destination, run the pipeline locally instead.

on:
  # On demand only: API mode costs money (~$0.30 per run). Free triage runs
  # inside the hourly fetch workflow instead. Add a `schedule:` here if you
  # ever want automatic daily drafts again.
  workflow_dispatch:
    inputs:
      limit:
        description: "Drafts to write this run"
        default: "5"

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Karachi
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
      SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DRAFT_LIMIT: ${{ github.event.inputs.limit || '5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require the existing cloud state destination before paid model calls
        run: |
          if [ -z "$FIREBASE_URL" ] || [ -z "$SITE_PASSCODE" ]; then
            echo "::error::Cloud drafts need the existing Firebase destination and Studio code. Run the pipeline locally for private local state."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Triage new stories, enrich, draft, verify
        env:
          STUDIO_STATE_PATH: ${{ runner.temp }}/creator-studio/pipeline.json
        run: python run_pipeline.py --mode api --limit "$DRAFT_LIMIT" --notify

      - name: Phone alert if the pipeline broke
        if: failure()
        run: |
          curl -s -m 15 -H "Title: AI x Ahmad - pipeline failed" -H "Priority: high" -H "Tags: warning" \
            -d "The daily draft run failed. Check github.com/ahmad19sep/ai-news-updater/actions" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
