name: Offline regression tests

on:
  push:
    paths:
      - "**/*.py"
      - "studio/**"
      - "*_test.js"
      - "requirements.txt"
      - "content/**"
      - "docs/templates.js"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.py"
      - "studio/**"
      - "*_test.js"
      - "requirements.txt"
      - "content/**"
      - "docs/templates.js"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      FIREBASE_URL: ""
      SITE_PASSCODE: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run deterministic backend and private-state tests
        env:
          STUDIO_STATE_PATH: ${{ runner.temp }}/creator-studio/pipeline.json
        run: python -m unittest discover -v

  browser:
    name: Offline Studio DOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_URL: ""
      SITE_PASSCODE: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --package-lock=false jsdom@30.1.1
      - name: Build the pages from current source without collecting news
        run: |
          python generate_public.py
          python generate_site.py
          python generate_studio.py
      - name: Check source syntax
        run: |
          node --check studio/app.js
          node --check studio/private-state.js
          node --check private_studio_test.js
          node --check private_ui_test.js
      - name: Run DOM suites without external document resources
        run: |
          for suite in public_test.js smoke_test.js ui_test.js studio_test.js private_studio_test.js private_ui_test.js; do
            STUDIO_TEST_SUITE="$suite" node - <<'JS'
          const jsdom = require("jsdom");
          const BaseJSDOM = jsdom.JSDOM;
          jsdom.JSDOM = class extends BaseJSDOM {
            constructor(html, options = {}) {
              super(html, { ...options, resources: undefined });
            }
          };
          require("./" + process.env.STUDIO_TEST_SUITE);
          JS
          done
