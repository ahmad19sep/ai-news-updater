name: AI Pulse (every 6 hours)

on:
  schedule:
    # Trends move slower than news, and this protects free API quotas.
    - cron: "15 */6 * * *"
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: pulse                # never run two Pulse cycles at once
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # All optional. Missing keys = those sources/LLM are skipped gracefully.
      YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
      GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the Pulse signal (collectors -> synthesizer -> docs/pulse.json)
        run: python generate_pulse.py

      - name: Save pulse.json + history back to the repo
        run: |
          git config user.name "ai-news-radar-bot"
          git config user.email "actions@github.com"
          git add docs/pulse.json pulse_history/
          if ! git diff --cached --quiet; then
            git commit -m "data: pulse update"
            # The news job (every 30 min) may push while we run; retry and let
            # fresh data win on the generated files.
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -gt 3 ]; then echo "giving up after 3 retries"; exit 1; fi
              git pull --rebase -X theirs origin main || {
                git checkout --theirs -- docs/ pulse_history/ 2>/dev/null || true
                git add docs/pulse.json pulse_history/
                GIT_EDITOR=true git rebase --continue || git rebase --skip || true
              }
            done
          fi
